<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Stardew" />
	<meta name="application-name" content="Stardew" />
	<meta name="theme-color" content="#000000" />
	<meta name="description" content="Stardew Valley, running in the browser." />
	<title>Stardew Valley</title>
	<link rel="manifest" href="manifest.json" />
	<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		html, body {
			width: 100%; height: 100%; overflow: hidden; background: #000;
			overscroll-behavior: none;
		}
		#loading {
			position: absolute; inset: 0;
			display: flex; align-items: center; justify-content: center;
			color: #fff; font: 1.5rem/1 sans-serif;
			z-index: 1;
			flex-direction: column; gap: 1rem;
		}
		#loading.hidden { display: none; }
		canvas {
			width: 100%; height: 100%; display: block;
			touch-action: none;
		}
	</style>
</head>
<body>
	<div id="loading">Loading...</div>
	<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
	<!-- Loaded before game.js so the controls exist while the game downloads. -->
	<script src="touch-controls.js"></script>
	<script src="cheat-panel.js"></script>
	<script src="save-sync.js"></script>
	<script type="module" src="game.js"></script>
</body>
</html>
